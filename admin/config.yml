backend:
  name: git-gateway
  branch: main

media_folder: "images/works"
public_folder: "/images/works"

locale: "ko"

collections:
  - name: "works"
    label: "포트폴리오"
    files:
      - file: "content/works.json"
        label: "작업물 목록"
        name: "works"
        fields:
          - label: "작업물"
            name: "items"
            widget: "list"
            summary: "{{title}} ({{category}})"
            fields:
              - { label: "제목 (상세페이지용, 긴 제목 가능)", name: "title", widget: "string" }
              - { label: "카드용 짧은 제목 (목록에 표시)", name: "shortTitle", widget: "string", required: false, hint: "예: 수제 손만두 — 비워두면 위 제목이 그대로 쓰여요" }
              - { label: "제품 종류 (카드에 'Category /'로 표시)", name: "productType", widget: "string", required: false, hint: "간결하게, 예: 반려동물 가구 — 상세페이지 문구를 그대로 끌어오지 마세요" }
              - { label: "URL 슬러그 (영문/숫자, 상세페이지 주소로 사용)", name: "slug", widget: "string", required: false, hint: "예: mandu, propolis — 비워두면 자동으로 번호가 부여돼요" }
              - label: "카테고리"
                name: "category"
                widget: "select"
                options:
                  - { label: "브랜딩", value: "branding" }
                  - { label: "상세페이지", value: "detail" }
                  - { label: "컨텐츠디자인", value: "content" }
                  - { label: "로고디자인", value: "logo" }
                  - { label: "패키지", value: "package" }
                  - { label: "AI 연출컷", value: "ai_cut" }
              - { label: "대표 이미지 (카드 썸네일)", name: "image", widget: "image", required: false }
              - { label: "클라이언트/브랜드명", name: "client", widget: "string", required: false }
              - { label: "연도", name: "year", widget: "string", required: false }
              - { label: "상세 설명", name: "description", widget: "text", required: false }
              - label: "추가 이미지 (상세보기 갤러리)"
                name: "gallery"
                widget: "list"
                required: false
                field: { label: "이미지", name: "src", widget: "image" }
